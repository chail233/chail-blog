# 站点标题
title = "chail's Blog"
# DoIt 主题版本
version = "0.4.X"
# 站点默认主题 ("light", "dark", "black", "auto")
defaultTheme = "auto"
# SRI 哈希算法，为空则不使用 SRI
fingerprint = ""
# 日期格式
dateFormat = "2006-01-02"
# 启用 PWA
enablePWA = false

[author]
  name = "chail"

# ========== 头部导航栏 ==========
[header]
  themeChangeMode = "select"
  [header.title]
    name = "chail's Blog"
    typeit = false

# ========== 页脚 ==========
[footer]
  enable = true
  hugo = true
  copyright = true
  author = true
  since = 2025

# ========== 文章列表页 ==========
[section]
  paginate = 12
  dateFormat = "01-02"
  rss = 10
  [section.recentlyUpdated]
    enable = false

# ========== 分类/标签页 ==========
[list]
  paginate = 12
  dateFormat = "01-02"
  rss = 10

# ========== 搜索配置 ==========
[search]
  enable = true
  type = "fuse"
  contentLength = 4000
  maxResultLength = 10
  snippetLength = 50
  highlightTag = "em"
  absoluteURL = false
  [search.fuse]
    isCaseSensitive = false
    minMatchCharLength = 2
    findAllMatches = false
    location = 0
    threshold = 0.3
    distance = 100
    ignoreLocation = true
    useExtendedSearch = false
    ignoreFieldNorm = false

# ========== 文章页面配置 ==========
[page]
  hiddenFromHomePage = false
  hiddenFromSearch = false
  twemoji = false
  lightgallery = true
  ruby = true
  fraction = true
  linkToMarkdown = false
  rssFullText = false
  seriesNavigation = true
  enableLastMod = true
  enableWordCount = true
  enableReadingTime = true

  [page.instantpage]
    enable = true

  [page.toc]
    enable = true
    keepStatic = false
    auto = true

  [page.code]
    maxShownLines = 12
    lineNos = true
    wrap = false
    header = true

  [page.table]
    sort = true

  [page.math]
    enable = false
    copyTex = true
    mhchem = true
    mathjax = false

  [page.share]
    enable = false

  [page.comment]
    enable = false

  [page.related]
    enable = true
    count = 5

# ========== 主页配置 ==========
[home]
  rss = 10
  [home.profile]
    enable = true
    title = "chail's Blog"
    subtitle = "记录生活、算法与思考"
    typeit = true
    social = true
  [home.posts]
    enable = true
    paginate = 7

# ========== 社交链接 ==========
[social]
  GitHub = "chail233"
  Email = "1744315424@qq.com"
  RSS = true

# ========== SEO ==========
[seo]
  image = ""
  thumbnailUrl = ""

[analytics]
  enable = false

[cookieconsent]
  enable = false

[cdn]
  data = ""

[compatibility]
  polyfill = false