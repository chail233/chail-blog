baseURL = "https://chail-blog.pages.dev/"
relativeURLs = true
canonifyURLs = false
locale = 'en-us'
title = 'chail`s Blog'
theme = "PaperMod"

[security]
enableInlineShortcodes = false
[security.subresourceIntegrity]
enable = false
[params.assets]
disableFingerprinting = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

ignoreLogs = ['warning-goldmark-raw-html']